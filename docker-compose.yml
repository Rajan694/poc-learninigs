services:
  user-service:
    build:
      context: ./backend/userService
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - ./backend/userService/.env
    ports:
      - "3001:3001"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  todo-service:
    build:
      context: ./backend/toDoService
      dockerfile: Dockerfile
    container_name: todo-service
    env_file:
      - ./backend/toDoService/.env
    ports:
      - "3002:3002"
    depends_on:
      todo-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  expence-manager-service:
    build:
      context: ./backend/expenceManagerService
      dockerfile: Dockerfile
    container_name: expence-manager-service
    env_file:
      - ./backend/expenceManagerService/.env
    ports:
      - "3003:3003"
    depends_on:
      expense-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: argusadmin
      POSTGRES_DB: auth_db
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  todo-db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: argusadmin
      POSTGRES_DB: todo_db
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  expense-db:
    image: postgres:16-alpine
    container_name: expense-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: argusadmin
      POSTGRES_DB: expense_db
    volumes:
      - expense-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  user-db-data:
  todo-db-data:
  expense-db-data:
  redis-data:
