apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:poc
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:3001"
            - name: TODO_SERVICE_URL
              value: "http://todo-service:3002"
            - name: EXPENSE_SERVICE_URL
              value: "http://expence-manager-service:3003"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 80
  type: NodePort
